[package]
name = "immich-s3-backup"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
aws-config = { version = "1.8.12", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.119.0"
chrono = { version = "0.4.42", default-features = false, features = ["now"] }
dotenvy = "0.15.7"
tokio = { version = "1.48.0", features = ["fs", "macros", "process", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
zip = { version = "7.0.0", default-features = false, features = ["deflate"] }
