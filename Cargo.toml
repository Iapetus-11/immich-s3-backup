[package]
name = "immich_s3_backup"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
async-stream = { version = "0.3.6", default-features = false }
aws-sdk-s3 = { version = "1.146.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["now"] }
clap = { version = "4.6.6", default-features = false, features = ["derive", "env", "help", "std"] }
dotenvy = { version = "0.15.7", default-features = false }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled", "chrono"] }
tokio = { version = "1.53.1", default-features = false, features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi"] }
zip = { version = "8.6.0", default-features = false, features = ["aes-crypto", "deflate-flate2-zlib-rs"] }
