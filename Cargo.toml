[package]
name = "immich_s3_backup"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
aws-config = { version = "1.8.12", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.119.0"
chrono = { version = "0.4.42", default-features = false, features = ["now", "serde"] }
clap = { version = "4.5.57", default-features = false, features = ["std", "derive", "help", "suggestions", "env"] }
dotenvy = "0.15.7"
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.149" }
tokio = { version = "1.48.0", features = ["fs", "macros", "process", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
zip = { version = "7.0.0", default-features = false, features = ["deflate"] }
